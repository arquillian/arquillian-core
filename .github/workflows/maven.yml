name: Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify with Maven - JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Keep this list as: all supported LTS JDKs, the latest GA JDK, and optionally the latest EA JDK (if available).
        # Reference: https://adoptium.net/support/
        java:
          - 11
          - 17
          - 21
          - 25
          - 26
    steps:
      - name: Checkout arquillian-core
        uses: actions/checkout@v7
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.java }}-test-reports
          path: |
            **/surefire-reports/*
            **/failsafe-reports/*

  # Test JUnit Jupiter module with JUnit 6.x (requires Java 17+)
  build-and-verify-junit6:
    name: Verify JUnit Jupiter with JUnit 6.x - JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        java:
          - 17
          - 21
          - 25
          - 26
    steps:
      - name: Checkout arquillian-core
        uses: actions/checkout@v7
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Build with JUnit 6.x
        run: mvn --batch-mode --no-transfer-progress clean verify -Pjunit6 -pl junit5/core,junit5/container -am
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.java }}-test-reports-junit6
          path: |
            **/surefire-reports/*
            **/failsafe-reports/*
